[package]
name = "agent-hub"
version = "0.1.13"
description = "agent-hub - AI Agent Skills Workspace"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "agent-hub"

[features]
default = ["standard"]
standard = ["herdr", "cloud-sync", "github", "gitlab"]
herdr = []
cloud-sync = []
github = []
gitlab = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
serde_json = "1.0"
embed-resource = "3"

[dependencies]
serde_json = "1.0"
shell-words = "1.1"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "devtools", "image-png", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.31", features = ["bundled", "limits", "hooks"] }
uuid = { version = "1", features = ["v4", "v7"] }
psl = "2"
sha2 = "0.10"
dirs = "5.0"
walkdir = "2.5"
fs2 = "0.4"
unicode-normalization = "0.1"
caseless = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1.0"
chrono = "0.4"
gethostname = "1"
serde_yaml = "0.9"
plist = "1.8"
base64 = "0.22"
git2 = { version = "0.19", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
hex = "0.4"
urlencoding = "2"
zip = "2"
tempfile = "3.26.0"
semver = "1"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "6.1.1"
clap = { version = "4.5", features = ["derive"] }
rfd = { version = "0.16", default-features = false }
portable-pty = "0.9.0"
libc = "0.2"
sysinfo = { version = "0.30.13", default-features = false }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
dunce = "1"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSURL"] }

# sha2 0.10 defaults to its software backend on ARM64. Enable its runtime
# SHA-2 feature detection on Apple/Linux ARM64; unsupported CPUs still fall
# back to software and existing fingerprints remain byte-for-byte identical.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Keep hashing representative in desktop development builds as well as release.
# Optimizing this dependency preserves application debug symbols and behavior.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tauri = { version = "2.10.0", features = ["test"] }

# Requires the real macOS event loop, so this suite supplies its own opt-in harness.
[[test]]
name = "native_preview_runtime"
path = "tests/native_preview_runtime.rs"
harness = false
