<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a2240"/>
      <stop offset="100%" stop-color="#07091a"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brand-glass" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.38"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Ambient center haze -->
  <circle cx="256" cy="256" r="175" fill="url(#brand)" opacity="0.07"/>

  <!-- Spokes: center → node centers
       top  (256, 101)   BL (122, 334)   BR (390, 334) -->
  <line x1="256" y1="256" x2="256" y2="101" stroke="url(#brand)" stroke-width="8" stroke-opacity="0.48" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="122" y2="334" stroke="url(#brand)" stroke-width="8" stroke-opacity="0.48" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="390" y2="334" stroke="url(#brand)" stroke-width="8" stroke-opacity="0.48" stroke-linecap="round"/>

  <!-- Node halos -->
  <circle cx="256" cy="101" r="40" fill="url(#brand)" opacity="0.12"/>
  <circle cx="122" cy="334" r="40" fill="url(#brand)" opacity="0.12"/>
  <circle cx="390" cy="334" r="40" fill="url(#brand)" opacity="0.12"/>

  <!-- Node bodies  r=28, gap from hub outer=51px -->
  <circle cx="256" cy="101" r="28" fill="url(#brand-glass)" stroke="url(#brand)" stroke-width="2"/>
  <circle cx="122" cy="334" r="28" fill="url(#brand-glass)" stroke="url(#brand)" stroke-width="2"/>
  <circle cx="390" cy="334" r="28" fill="url(#brand-glass)" stroke="url(#brand)" stroke-width="2"/>

  <!-- Node inner dots -->
  <circle cx="256" cy="101" r="9" fill="#ddd6fe"/>
  <circle cx="122" cy="334" r="9" fill="#ddd6fe"/>
  <circle cx="390" cy="334" r="9" fill="#ddd6fe"/>

  <!-- Hub outer glow -->
  <circle cx="256" cy="256" r="98" fill="url(#brand)" opacity="0.09"/>
  <circle cx="256" cy="256" r="86" fill="url(#brand)" opacity="0.07"/>

  <!-- Hub ring  outer=76, cutout=54 -->
  <circle cx="256" cy="256" r="76" fill="url(#brand)"/>
  <circle cx="256" cy="256" r="54" fill="#0a0d1e"/>

  <!-- Hub center dot -->
  <circle cx="256" cy="256" r="26" fill="url(#brand)"/>
</svg>
