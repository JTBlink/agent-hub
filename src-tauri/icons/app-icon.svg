<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="182" y1="172" x2="842" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7B8FF" />
      <stop offset="0.52" stop-color="#8096FF" />
      <stop offset="1" stop-color="#59D8B1" />
    </linearGradient>
  </defs>

  <!--
    Master icon contract: 1024 × 1024 RGBA canvas.
    Opaque card: x/y 68, size 888, radius 192, border 8.
    Only the rounded-corner outside remains transparent.
  -->
  <rect x="68" y="68" width="888" height="888" rx="192" fill="#0F172A" />
  <rect x="72" y="72" width="880" height="880" rx="188" fill="none" stroke="#2A3F63" stroke-width="8" />

  <!-- Three agent nodes connected to one local workspace hub. All fills are opaque. -->
  <line x1="512" y1="508" x2="512" y2="288" stroke="#8096FF" stroke-width="12" stroke-linecap="round" />
  <line x1="512" y1="508" x2="321" y2="620" stroke="#8096FF" stroke-width="12" stroke-linecap="round" />
  <line x1="512" y1="508" x2="703" y2="620" stroke="#59D8B1" stroke-width="12" stroke-linecap="round" />

  <circle cx="512" cy="288" r="62" fill="#243766" stroke="#A7B8FF" stroke-width="8" />
  <circle cx="321" cy="620" r="62" fill="#243766" stroke="#8096FF" stroke-width="8" />
  <circle cx="703" cy="620" r="62" fill="#1D4A47" stroke="#59D8B1" stroke-width="8" />
  <circle cx="512" cy="288" r="18" fill="#F3F6FF" />
  <circle cx="321" cy="620" r="18" fill="#F3F6FF" />
  <circle cx="703" cy="620" r="18" fill="#E4FFF5" />

  <circle cx="512" cy="508" r="142" fill="#1B2C50" stroke="#8096FF" stroke-width="8" />
  <circle cx="512" cy="508" r="94" fill="#0F172A" stroke="#59D8B1" stroke-width="8" />
  <circle cx="512" cy="508" r="36" fill="url(#brand)" />
</svg>
