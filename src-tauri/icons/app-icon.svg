<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Same highlight direction as the topology's .hub-orbit surface. -->
    <radialGradient id="workspace" cx="35%" cy="28%" r="100%">
      <stop stop-color="#294A7C" />
      <stop offset="0.68" stop-color="#0D1930" />
      <stop offset="1" stop-color="#0D1930" />
    </radialGradient>
    <!-- Exact palette and direction from the page's BrandGlyph component. -->
    <linearGradient id="brand-flow" x1="10" y1="8" x2="55" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168BFF" />
      <stop offset="0.52" stop-color="#4F8DFF" />
      <stop offset="1" stop-color="#42D9B1" />
    </linearGradient>
  </defs>

  <!-- macOS master: 1024 canvas, 830px opaque rounded card, transparent only outside. -->
  <rect x="97" y="97" width="830" height="830" rx="192" fill="#0F1835" />
  <rect x="105" y="105" width="814" height="814" rx="184" fill="none" stroke="#263B67" stroke-width="6" />

  <!-- One circular workspace carries the existing AgentHub BrandGlyph. -->
  <circle cx="512" cy="522" r="304" fill="#09142B" />
  <circle cx="512" cy="512" r="304" fill="url(#workspace)" stroke="#47699E" stroke-width="10" />
  <g transform="translate(281.6 267.2) scale(7.2)">
    <path d="M32 12v14M15 48l12-9M49 48l-12-9" fill="none" stroke="#07101F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M32 10v16M13 49l14-10M51 49 37 39" fill="none" stroke="url(#brand-flow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="9" r="6" fill="#172B4F" stroke="#5FAAFF" stroke-width="3" />
    <circle cx="12" cy="50" r="6" fill="#172B4F" stroke="#868FFF" stroke-width="3" />
    <circle cx="52" cy="50" r="6" fill="#172B4F" stroke="#42D9B1" stroke-width="3" />
    <circle cx="32" cy="34" r="11" fill="#0D1930" stroke="#263F70" stroke-width="4" />
    <circle cx="32" cy="34" r="6" fill="#168BFF" stroke="#62DDBD" stroke-width="2" />
    <circle cx="32" cy="34" r="2.3" fill="#EFFFFF" />
  </g>
</svg>
