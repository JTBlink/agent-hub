name: Issue metadata

on:
  issues:
    types:
      [
        opened,
        reopened,
        closed,
        edited,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-metadata-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted default branch scripts
        uses: actions/checkout@v5
        with:
          ref: "${{ github.event.repository.default_branch }}"
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Synchronize issue state and milestones
        run: node scripts/issue-metadata.mjs
        env:
          GITHUB_TOKEN: "${{ github.token }}"
