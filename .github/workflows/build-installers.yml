name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      resolved_sha: ${{ steps.resolve_ref.outputs.sha }}
      release_tag: ${{ steps.release_metadata.outputs.tag }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Resolve immutable build revision
        id: resolve_ref
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify version consistency
        id: release_metadata
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            tag="v$version"
            node scripts/check-version.mjs "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Apple signing and notarization configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required when ENABLE_APPLE_SIGNING=true"
              exit 1
            fi
          done

      - name: Validate Windows signing configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_SIGNING_TIMESTAMP_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required when ENABLE_WINDOWS_SIGNING=true"
              exit 1
            fi
          done

  quality:
    name: Verify release candidate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.resolved_sha }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run format:check
          npm run lint
          npm run test
          npm run build

      - name: Verify Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: [preflight, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            artifact: windows-x86_64
            rust_targets: ""
            tauri_args: "--bundles nsis,msi"
            bundle_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS Universal
            os: macos-latest
            artifact: macos-universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: "--target universal-apple-darwin --bundles app,dmg"
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
            rust_targets: ""
            tauri_args: "--bundles appimage,deb"
            bundle_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.resolved_sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned or non-macOS installers
        if: github.event_name == 'workflow_dispatch' || runner.os != 'macOS' || vars.ENABLE_APPLE_SIGNING != 'true'
        run: npm run app:build -- ${{ matrix.tauri_args }}

      - name: Build macOS release installers
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run app:build -- ${{ matrix.tauri_args }}

      - name: Smoke install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $installRoot = Join-Path $env:RUNNER_TEMP "agent-hub-smoke-install"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait
          $executable = Join-Path $installRoot "agent-hub.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Installed AgentHub executable was not found" }
          # GUI-subsystem executables do not reliably populate PowerShell's
          # $LASTEXITCODE. Capture the native process exit code explicitly.
          $smoke = Start-Process -FilePath $executable -ArgumentList "--smoke" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed AgentHub package smoke checks failed (exit code $($smoke.ExitCode))" }
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed AgentHub exited during smoke launch" }
          Stop-Process -Id $process.Id -Force

      - name: Smoke install and launch Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get install --yes "$(realpath "$deb")"
          command -v agent-hub
          agent-hub --smoke
          timeout 15s xvfb-run -a agent-hub || test "$?" -eq 124

      - name: Smoke install and launch macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_point="$RUNNER_TEMP/agent-hub-dmg"
          app_path="$RUNNER_TEMP/AgentHub.app"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          ditto "$mount_point/AgentHub.app" "$app_path"
          hdiutil detach "$mount_point"
          "$app_path/Contents/MacOS/agent-hub" --smoke
          open "$app_path"
          sleep 8
          pgrep -f "$app_path/Contents/MacOS/agent-hub"
          pkill -f "$app_path/Contents/MacOS/agent-hub" || true

      - name: Verify macOS notarization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentHub.app"
          test -d "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Run cross-platform configuration and persistence tests
        shell: bash
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --test agent_configs
          --test claude_config
          --test diagnostic_recovery
          --test persistence

      - name: Sign Windows installers
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "agent-hub-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found on the runner" }
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe", "src-tauri\target\release\bundle\msi\*.msi" | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
          }
          Remove-Item $certificatePath -Force

      - name: Report unsigned macOS release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING != 'true'
        run: echo "ENABLE_APPLE_SIGNING is disabled; publishing an unsigned macOS installer."

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error
          retention-days: 90

  package:
    name: Assemble installers and checksums
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.resolved_sha }}

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: agent-hub-*
          path: release-assets
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate and assemble release bundle
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: npm run release:assemble -- release-assets "$BUILD_REF"

      - name: Verify release bundle
        run: npm run release:verify -- release-assets

      - name: Upload combined installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-installers-${{ github.run_id }}
          path: release-assets
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged release bundle
        uses: actions/download-artifact@v4
        with:
          name: agent-hub-installers-${{ github.run_id }}
          path: release-assets

      - name: Check whether GitHub Release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          if gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          name: AgentHub ${{ needs.preflight.outputs.release_tag }}
          target_commitish: ${{ needs.preflight.outputs.resolved_sha }}
          draft: false
          generate_release_notes: false
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/CHANGELOG.md
            release-assets/PLATFORM_SUPPORT.md
            release-assets/RELEASE_NOTES.md
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.preflight.outputs.release_tag, '-') }}
