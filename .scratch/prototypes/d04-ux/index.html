<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjx0ZXh0IHk9IjAuOWVtIiBmb250LXNpemU9IjkwIj7imaE8L3RleHQ+PC9zdmc+"
    />
    <title>AgentHub D04 UX Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0b1018;
        color: #edf2fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 10% 0, #253d70, transparent 34rem), #0b1018;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .page {
        min-height: 100vh;
        padding: 28px 30px 110px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      .brand {
        font-size: 1.18rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .brand b {
        color: #8ba3ff;
      }
      .title {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
      }
      .title h1,
      .title h2,
      .title p {
        margin: 0;
      }
      .title h1 {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        letter-spacing: -0.05em;
      }
      .muted {
        color: #96a4ba;
      }
      .eyebrow {
        margin-bottom: 6px;
        color: #8ba3ff;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .panel {
        border: 1px solid #293650;
        border-radius: 18px;
        background: #121c2aef;
        box-shadow: 0 18px 48px #0003;
      }
      .pad {
        padding: 19px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .list {
        display: grid;
        gap: 8px;
        margin-top: 13px;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 14px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: #172337;
      }
      .item.selected {
        border-color: #7189ff;
        background: #1d2b4b;
      }
      .item strong,
      .item small {
        display: block;
      }
      .item small {
        margin-top: 4px;
        color: #91a0b8;
      }
      .pill {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 999px;
        background: #1c2a42;
        color: #c1cef0;
        font-size: 0.72rem;
        white-space: nowrap;
      }
      .good {
        background: #12362f;
        color: #8be3bf;
      }
      .warn {
        background: #49351e;
        color: #ffc77d;
      }
      .bad {
        background: #48262e;
        color: #ff9eaf;
      }
      .button {
        border: 1px solid #3b4d70;
        border-radius: 10px;
        padding: 9px 13px;
        background: #1c2a43;
      }
      .primary {
        border-color: #7891ff;
        background: #657cff;
        color: #091022;
        font-weight: 750;
      }
      .code {
        min-height: 210px;
        margin: 14px 0 0;
        padding: 17px;
        border-radius: 12px;
        background: #090e15;
        color: #cad5e8;
        font:
          0.8rem/1.7 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .stat {
        padding: 18px;
      }
      .stat strong {
        display: block;
        margin: 8px 0 2px;
        font-size: 1.9rem;
      }
      .stat small {
        color: #91a0b8;
      }
      .warning {
        padding: 13px 15px;
        border-left: 3px solid #e6a359;
        border-radius: 9px;
        background: #3a2a1b;
        color: #ffd397;
      }
      .step {
        position: relative;
        padding: 20px 20px 20px 65px;
      }
      .step::before {
        content: attr(data-step);
        position: absolute;
        left: 20px;
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: #657cff;
        color: #091022;
        font-weight: 800;
      }
      .step h2 {
        margin: 0 0 6px;
        font-size: 1rem;
      }
      .step p {
        margin: 0 0 13px;
        color: #a3b0c4;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .switcher {
        position: fixed;
        z-index: 5;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 9px 14px;
        border: 1px solid #52628a;
        border-radius: 999px;
        background: #111a29ee;
        box-shadow: 0 14px 45px #0009;
      }
      .switcher button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: #263756;
      }
      .switcher strong {
        min-width: 155px;
        text-align: center;
        font-size: 0.8rem;
      }
      @media (max-width: 760px) {
        .page {
          padding: 20px 16px 100px;
        }
        .two,
        .three {
          grid-template-columns: 1fr;
        }
        .switcher strong {
          min-width: 110px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const variants = ["A", "B", "C"];
      const labels = { A: "导航分栏", B: "工作台总览", C: "任务流确认" };
      const configs = [
        ["settings.json", "Claude Code · 全局", "已同步", "good"],
        ["config.toml", "Codex · 工作空间", "外部修改", "warn"],
        ["opencode.json", "OpenCode · 全局", "解析失败", "bad"],
      ];
      const skills = [
        ["frontend-design", "anthropics/skills", "3/3 Agent", "good"],
        ["systematic-debugging", "obra/superpowers", "2/3 Agent", "warn"],
        ["private-review", "本地仓库目录", "兼容未知", "warn"],
      ];
      const query = new URLSearchParams(location.search);
      let current = variants.includes(query.get("variant"))
        ? query.get("variant")
        : "A";
      const rows = (items) =>
        items
          .map(
            (x, i) =>
              `<div class="item ${i === 0 ? "selected" : ""}"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><span class="pill ${x[3]}">${x[2]}</span></div>`,
          )
          .join("");
      const heading = (kicker, title, text) =>
        `<header class="top"><div class="brand">Agent<b>Hub</b></div><span class="pill">D04 · 可抛弃原型</span></header><div class="title"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="muted">${text}</p></div><button class="button primary">刷新扫描</button></div>`;
      function a() {
        return `<main class="page">${heading("配置中心", "按 Agent 和作用域管理配置", "文件状态、诊断和 Diff 保持在同一个工作上下文。")}
        <div class="grid two" style="margin-top:28px"><aside class="panel pad"><div class="eyebrow">作用域</div><div class="list"><div class="item selected"><strong>全局</strong><span class="pill">3</span></div><div class="item"><strong>工作空间 · agent-hub</strong><span class="pill">2</span></div></div><div class="eyebrow" style="margin-top:24px">Agent</div><div class="list"><div class="item selected"><strong>Claude Code</strong></div><div class="item"><strong>Codex</strong></div><div class="item"><strong>OpenCode</strong></div></div></aside>
        <section class="stack"><div class="panel pad"><div class="title"><h2>配置文件</h2><select class="button"><option>全部状态</option><option>需要处理</option></select></div><div class="list">${rows(configs)}</div></div><div class="panel pad"><div class="title"><div><h2>settings.json</h2><p class="muted">表单 / 源码</p></div><span class="pill good">校验通过</span></div><pre class="code">// 未知字段和格式保持原样\n{\n  "permissions": { "allow": ["Read"] },\n  "model": "sonnet"\n}</pre><div class="actions"><button class="button">回滚</button><button class="button primary">预览 Diff</button></div></div><div class="warning">外部修改或解析失败会阻止保存，重新加载后展示三方 Diff。</div></section></div></main>`;
      }
      function b() {
        return `<main class="page">${heading("工作台", "今天需要处理什么", "总览只做分诊，高风险操作进入专题页和确认计划。")}
        <div class="grid three" style="margin-top:28px"><div class="panel stat"><span class="muted">配置文件</span><strong>5</strong><small>1 个需处理</small></div><div class="panel stat"><span class="muted">Skills</span><strong>18</strong><small>2 个可更新</small></div><div class="panel stat"><span class="muted">待确认计划</span><strong>2</strong><small>预计修改 7 个文件</small></div></div>
        <div class="grid two" style="margin-top:16px"><section class="panel pad"><div class="title"><div><div class="eyebrow">优先处理</div><h2>配置诊断</h2></div><button class="button">打开配置中心</button></div><div class="list">${rows(configs.slice(1))}</div></section><section class="panel pad"><div class="title"><div><div class="eyebrow">Skills 中心</div><h2>来源与兼容性</h2></div><button class="button primary">添加来源</button></div><div class="list">${rows(skills)}</div></section></div>
        <section class="panel pad" style="margin-top:16px"><div class="title"><div><div class="eyebrow">最近活动</div><h2>所有操作都有回滚点</h2></div><button class="button">查看历史</button></div><div class="grid three" style="margin-top:14px"><div class="item"><div><strong>扫描 3 个 Agent</strong><small>刚刚 · 发现外部修改</small></div></div><div class="item"><div><strong>生成安装计划</strong><small>12 分钟前 · 3 个目标</small></div></div><div class="item"><div><strong>回滚 settings.json</strong><small>昨天 · 备份 #03</small></div></div></div></section></main>`;
      }
      function c() {
        return `<main class="page">${heading("变更计划", "先看影响，再一次确认", "配置保存与 Skill 安装共享来源、目标、Diff 和回滚边界。")}
        <div class="stack" style="max-width:820px;margin:28px auto"><section class="panel step" data-step="1"><h2>选择 Agent 与作用域</h2><p>安装 frontend-design 到 Claude Code 全局和当前工作空间。</p><div class="grid two"><div class="item selected"><div><strong>Claude Code</strong><small>全局 · ~/.claude/skills</small></div><span class="pill good">兼容</span></div><div class="item"><div><strong>Codex</strong><small>工作空间 · .agents/skills</small></div><span class="pill warn">需确认</span></div></div></section>
        <section class="panel step" data-step="2"><h2>检查来源和文件</h2><p>anthropics/skills · ref main · commit 8a31…e21</p><div class="warning">来源包含 scripts/。AgentHub 只复制受管文件，不执行脚本、hooks 或依赖安装。</div><div class="list"><div class="item"><span>SKILL.md</span><span class="pill good">新增</span></div><div class="item"><span>references/patterns.md</span><span class="pill good">新增</span></div></div></section>
        <section class="panel step" data-step="3"><h2>确认 Diff 与回滚点</h2><p>目标发生外部修改时计划立即失效，不会静默覆盖。</p><pre class="code">+ .claude/skills/frontend-design/SKILL.md\n+ references/patterns.md\n\n备份：#20260822-04 · 修改：2 个文件</pre><div class="actions"><button class="button">取消</button><button class="button primary">确认并安装</button></div></section>
        <section class="panel pad"><strong>空状态与部分兼容</strong><p class="muted">没有条目时展示“添加来源”；解析失败保留来源与原始内容，但不创建计划。</p></section></div></main>`;
      }
      function cycle(delta) {
        current =
          variants[
            (variants.indexOf(current) + delta + variants.length) %
              variants.length
          ];
        history.replaceState(null, "", `?variant=${current}`);
        render();
      }
      function render() {
        document.querySelector("#app").innerHTML =
          (current === "A" ? a() : current === "B" ? b() : c()) +
          `<nav class="switcher"><button id="prev">←</button><strong>${current} — ${labels[current]}</strong><button id="next">→</button></nav>`;
        document.querySelector("#prev").onclick = () => cycle(-1);
        document.querySelector("#next").onclick = () => cycle(1);
      }
      addEventListener("keydown", (event) => {
        if (
          ["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement?.tagName,
          ) ||
          document.activeElement?.isContentEditable
        )
          return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      render();
    </script>
  </body>
</html>
