[package]
name = "agent-hub-core"
version = "0.1.3"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Shared AgentHub domain library and desktop SDK build entry"
repository = "https://github.com/JTBlink/agent-hub"
include = ["build.rs", "src/**", "tests/**", "install.mjs", "build-product.mjs", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
dirs = "5.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1"
tempfile = { version = "3.26", optional = true }

[features]
sdk-cli = ["dep:tempfile"]

[[bin]]
name = "agent-hub-core"
path = "src/main.rs"
required-features = ["sdk-cli"]

[build-dependencies]
serde_json = "1"
