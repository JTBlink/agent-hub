<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentHub Skill 安装原型</title><style>
:root{--bg:#08101f;--surface:#111d35;--deep:#0c162b;--line:#263b67;--ink:#edf4ff;--muted:#a7b9d6;--quiet:#7184a5;--teal:#42d9b1}*{box-sizing:border-box}body{margin:0;min-width:320px;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:248px 1fr;height:100vh}.side{padding:28px 16px;background:#f7fffd;color:#10243a}.brand{padding:0 12px 26px;font-size:17px}.brand small{display:block;color:var(--quiet);font-size:11px}.ctx{margin:0 4px 24px;padding:11px;border:1px solid #b8d8d3;border-radius:10px;background:#fff;font-size:12px}.ctx span{display:block;color:#59716e;font-size:11px}.nav button{display:block;width:100%;height:44px;border:0;border-radius:9px;background:transparent;color:#59716e;text-align:left;padding:0 12px}.nav .on{background:#dff2ed;color:#08786e;font-weight:700}.privacy{margin-top:calc(100vh - 520px);padding:18px 10px;border-top:1px solid #b8d8d3;color:#0b8177;font-size:11px}.main{padding:34px 40px;overflow:auto}.crumb{color:var(--quiet);font-size:12px}.crumb b{color:var(--ink)}h1{margin:7px 0 4px;font-size:28px}.sub{margin:0 0 26px;color:var(--muted)}.panel{max-width:980px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.steps{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}.step{padding:15px 12px;color:var(--quiet);font-size:12px}.step b{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:5px;border:1px solid var(--line);border-radius:50%}.step.on{color:var(--ink);background:#142341}.step.on b,.step.done b{border-color:var(--teal);background:var(--teal);color:#092329}.body{padding:28px}.body h2{margin:0 0 6px;font-size:20px}.hint{color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button,.choice,.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--deep);color:var(--muted);cursor:pointer}.tabs .on,.choice.on{border-color:var(--teal);background:#102b35;color:var(--ink)}label{display:block;margin:13px 0 6px;color:var(--muted);font-size:12px;font-weight:600}input,select{width:100%;height:44px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--deep);color:var(--ink)}.cmd,.status,.file{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--deep);font-size:12px}.cmd{margin:14px 0;font-family:monospace;color:#c9daf2}.status{margin:16px 0;background:#123a3b;color:#bdf8e5}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.file{border:0;border-bottom:1px solid var(--line);border-radius:0;display:flex;justify-content:space-between}.file:last-child{border:0}.tag{color:var(--teal)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:block;width:100%;text-align:left;padding:12px}.choice small{display:block;margin-top:4px;color:var(--quiet)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}.primary{border-color:var(--teal);background:var(--teal);color:#092329;font-weight:700}.btn:disabled{opacity:.5}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px 16px}.body{padding:22px}.steps{grid-template-columns:repeat(5,1fr)}.step{padding:9px 4px;font-size:10px}.choices{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>AgentHub</b><small>AI Agent 工作区</small></div><div class="ctx"><b>当前工作区</b><span>&lt;workspace&gt;</span></div><nav class="nav"><button>总览</button><button>配置中心</button><button class="on">Skills <span style="float:right">12</span></button><button>工作区</button><button>诊断中心</button><button>变更历史</button></nav><div class="privacy">本地优先</div></aside><main class="main"><div class="crumb">AgentHub　/　<b>Skills</b>　/　添加 Skill</div><h1>安装 Skill</h1><p class="sub">本地目录扫描后可同时勾选多个 Skill；远端 Git 保留官方 npx skills 安装意图。</p><section class="panel"><div class="steps"><div class="step on" id="p1"><b>1</b>来源</div><div class="step" id="p2"><b>2</b>扫描</div><div class="step" id="p3"><b>3</b>选择</div><div class="step" id="p4"><b>4</b>目标</div><div class="step" id="p5"><b>5</b>计划</div></div><div class="body" id="v"></div></section></main></div><script>
const skills=[{id:'ui-ux-pro-max',desc:'UI/UX design intelligence'},{id:'frontend-design',desc:'Frontend patterns'}];
const agents=[{id:'claude-code',name:'Claude Code',note:'已检测'},{id:'codex',name:'Codex',note:'可选'},{id:'opencode',name:'OpenCode',note:'可选'}];
const s={n:1,k:'local',selected:new Set(['ui-ux-pro-max','frontend-design']),agents:new Set(['claude-code']),scope:'global',workspace:''};
const v=document.getElementById('v');
function go(n){s.n=n;for(let i=1;i<6;i++)document.getElementById('p'+i).className='step '+(i===n?'on':i<n?'done':'');render();if(n===4)addInstallMode()}
function addInstallMode(){if(document.getElementById('install-mode'))return;const wrap=document.createElement('label');wrap.id='install-mode';wrap.innerHTML='安装方式<select><option>Link · 软链接，源目录修改立即生效</option><option>Import · 复制到 AgentHub Library</option></select>';v.insertBefore(wrap,v.querySelector('.actions'))}
function sourceFields(){return s.k==='local'?'<label>来源目录（单个根目录）</label><input value="D:\\skills-library" readonly><p class="hint">目录已授权；支持 ./、../ 相对路径或 Windows 绝对路径。扫描后可从该目录中批量选择 Skill。</p>':`<label>来源地址</label><input value="https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"><label>Skill 名称（可选）</label><input value="ui-ux-pro-max">${s.k==='git'?'<div class="cmd">npx skills add https://github.com/nextlevelbuilder/ui-ux-pro-max-skill --skill ui-ux-pro-max</div>':''}`}
function render(){
  if(s.n===1)v.innerHTML=`<h2>选择 Skill 来源</h2><p class="hint">支持远端来源和本地目录；本地目录一次扫描可安装多个 Skill。</p><div class="tabs">${[['local','本地目录'],['git','Git 远端'],['skills','skills.sh'],['market','Marketplace']].map(x=>`<button class="${s.k===x[0]?'on':''}" onclick="s.k='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${sourceFields()}<div class="actions"><button class="btn">取消</button><button class="btn primary" onclick="go(2)">扫描来源 →</button></div>`;
  else if(s.n===2)v.innerHTML=`<h2>扫描来源</h2><p class="hint">只读取目录并查找 SKILL.md，不执行脚本。</p><div class="status">本地目录已授权 · 内容指纹 4f92…a10 · 发现 ${skills.length} 个可安装 Skill</div><div class="list"><div class="file"><span>ui-ux-pro-max/SKILL.md</span><b class="tag">有效</b></div><div class="file"><span>frontend-design/SKILL.md</span><b class="tag">有效</b></div><div class="file"><span>scripts/</span><b style="color:#f3b75f">仅提示，不执行</b></div></div><div class="actions"><button class="btn" onclick="go(1)">← 返回</button><button class="btn primary" onclick="go(3)">选择 Skill →</button></div>`;
  else if(s.n===3){const all=s.selected.size===skills.length;v.innerHTML=`<h2>选择要安装的 Skill</h2><p class="hint">本地来源支持多选。至少选择 1 个 Skill 才能继续。</p><div class="selection-toolbar"><label class="choice ${all?'on':''}"><input type="checkbox" ${all?'checked':''} onchange="toggleAll(this.checked)"> 全选（${s.selected.size}/${skills.length}）</label><button class="btn" onclick="invertSelection()">反选</button><span class="selection-count">已选 ${s.selected.size} 个</span></div><div class="choices">${skills.map(item=>`<label class="choice skill-choice ${s.selected.has(item.id)?'on':''}"><input type="checkbox" ${s.selected.has(item.id)?'checked':''} onchange="toggle('${item.id}')"><span><b>${item.id}</b><small>${item.desc}</small></span></label>`).join('')}</div><div class="actions"><button class="btn" onclick="go(2)">← 返回</button><button class="btn primary" onclick="go(4)" ${s.selected.size?'':'disabled'}>继续 →</button></div>`}
  else if(s.n===4){const selectedAgentCount=s.agents.size;v.innerHTML=`<h2>选择安装目标</h2><p class="hint">为 ${s.selected.size} 个 Skill 选择一个或多个 Agent；每个组合都会生成独立安装项。</p><label>目标 Agent（可多选）</label><div class="choices">${agents.map(item=>`<label class="choice ${s.agents.has(item.id)?'on':''}"><input type="checkbox" ${s.agents.has(item.id)?'checked':''} onchange="toggleAgent('${item.id}')"><span><b>${item.name}</b><small>${item.note}</small></span></label>`).join('')}</div><p class="hint">已选 ${selectedAgentCount} 个 Agent</p><label>安装范围</label><select onchange="s.scope=this.value;render()"><option value="global" ${s.scope==='global'?'selected':''}>全局 · 当前用户</option><option value="workspace" ${s.scope==='workspace'?'selected':''}>工作区</option></select>${s.scope==='workspace'?'<label>工作区</label><select onchange="s.workspace=this.value"><option value="">选择工作区</option><option value="demo">&lt;workspace&gt;</option></select>':''}<div class="actions"><button class="btn" onclick="go(3)">← 返回</button><button class="btn primary" onclick="go(5)" ${selectedAgentCount&&(!s.scope||s.scope==='global'||s.workspace)?'':'disabled'}>生成安装计划 →</button></div>`}
  else {const target=s.scope==='workspace'?'<workspace>/.agents/skills':'~/.agents/skills';v.innerHTML=`<h2>确认安装计划</h2><p class="hint">确认后才会写入磁盘，包含 ${s.selected.size} 个 Skill × ${s.agents.size} 个 Agent。</p><div class="status">目标可写 · 备份点将自动创建 · 冲突：无</div><div class="list">${[...s.selected].flatMap(skill=>[...s.agents].map(agent=>`<div class="file"><span>${target}/${skill} <small>→ ${agent}</small></span><b class="tag">新增</b></div>`)).join('')}</div><div class="actions"><button class="btn" onclick="go(4)">← 修改目标</button><button class="btn primary" onclick="alert('安装完成，已写入变更历史')">确认并安装</button></div>`}
}
function toggle(id){s.selected.has(id)?s.selected.delete(id):s.selected.add(id);render()}
function toggleAll(checked){s.selected=new Set(checked?skills.map(item=>item.id):[]);render()}
function invertSelection(){s.selected=new Set(skills.filter(item=>!s.selected.has(item.id)).map(item=>item.id));render()}
function toggleAgent(id){s.agents.has(id)?s.agents.delete(id):s.agents.add(id);render()}
render();
</script><style>.choice input{width:18px;height:18px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--teal)}.selection-toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 4px}.selection-toolbar .choice{width:auto;min-width:190px;margin:0}.selection-count{color:var(--muted);font-size:12px}.btn:focus-visible,.tabs button:focus-visible,.choice:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}@media(max-width:760px){.selection-toolbar{flex-wrap:wrap}.selection-toolbar .choice{min-width:0;flex:1}}</style></body></html>
