<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentHub · GitHub / GitLab 任务与终端原型</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08101f;
        --side: #0c162b;
        --surface: #111d35;
        --hover: #182748;
        --active: #203356;
        --line: #263b67;
        --subtle: #203454;
        --text: #edf4ff;
        --secondary: #d4e2f8;
        --muted: #a7b9d6;
        --faint: #7184a5;
        --accent: #168bff;
        --blue: #66b5ff;
        --accent-bg: rgb(22 139 255 / 12%);
        --teal: #42d9b1;
        --violet: #9b9cff;
        --danger: #ff7c82;
        --danger-bg: #4b252e;
        --scrim: rgb(2 8 18 / 72%);
        --shadow: 0 18px 50px rgb(0 0 0 / 25%);
        font:
          13px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          sans-serif;
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg: #f3f7ff;
        --side: #eaf1fc;
        --surface: #fff;
        --hover: #edf4ff;
        --active: #ddeaff;
        --line: #c1d2ed;
        --subtle: #d7e2f3;
        --text: #111d35;
        --secondary: #263b67;
        --muted: #476084;
        --faint: #607595;
        --blue: #0872dc;
        --accent-bg: rgb(22 139 255 / 8%);
        --teal: #159e88;
        --violet: #696acb;
        --danger: #c5364c;
        --danger-bg: rgb(197 54 76 / 8%);
        --scrim: rgb(17 29 53 / 32%);
        --shadow: 0 18px 50px rgb(17 29 53 / 12%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      button {
        background: none;
        border: 0;
      }
      .icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        vertical-align: middle;
        stroke-width: 1.65;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .small {
        font-size: 12px;
      }
      .tiny {
        font-size: 11px;
      }
      .mono {
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
        flex-shrink: 0;
      }
      .teal {
        color: var(--teal);
      }
      .violet {
        color: var(--violet);
      }
      .blue {
        color: var(--blue);
      }
      .danger {
        color: var(--danger);
      }
      .sep {
        height: 18px;
        width: 1px;
        background: var(--line);
        margin: 0 4px;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 220px;
        background: var(--side);
        border-right: 1px solid var(--subtle);
        padding: 20px 12px 14px;
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .traffic {
        display: flex;
        gap: 7px;
        margin: 0 0 24px 8px;
      }
      .traffic span {
        height: 10px;
        width: 10px;
        border: 1px solid var(--line);
        border-radius: 100%;
        background: var(--surface);
      }
      .brand {
        padding: 0 9px 26px;
        font-weight: 650;
        font-size: 17px;
        gap: 10px;
      }
      .brand-mark {
        width: 27px;
        height: 27px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3px;
        transform: rotate(-8deg);
      }
      .brand-mark i {
        background: var(--accent);
        border-radius: 3px;
      }
      .brand-mark i:nth-child(2) {
        background: var(--teal);
      }
      .brand-mark i:nth-child(3) {
        background: var(--violet);
      }
      .brand-mark i:last-child {
        opacity: 0.35;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 7px;
        color: var(--muted);
      }
      .nav button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .nav button.active {
        background: var(--active);
        color: var(--text);
      }
      .nav .number {
        margin-left: auto;
        font-size: 11px;
        color: var(--blue);
      }
      .nav-label {
        padding: 25px 12px 9px;
        font-size: 11px;
        color: var(--faint);
      }
      .project-dot {
        width: 19px;
        height: 19px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        background: var(--hover);
        font-size: 10px;
        color: var(--violet);
        font-weight: 650;
      }
      .side-bottom {
        margin-top: auto;
        border-top: 1px solid var(--subtle);
        padding: 13px 8px 0;
      }
      .side-bottom .row {
        gap: 7px;
      }
      .prototype-note {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .main {
        margin-left: 220px;
        width: calc(100% - 220px);
        min-width: 0;
        min-height: 100vh;
        padding-bottom: 90px;
      }
      .topbar {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        border-bottom: 1px solid var(--subtle);
        font-size: 12px;
        color: var(--muted);
      }
      .content {
        padding: 30px;
        max-width: 1680px;
        margin: auto;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 12px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 7px 11px;
        border-radius: 6px;
        white-space: nowrap;
        min-height: 32px;
      }
      .button:hover {
        background: var(--hover);
      }
      .button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .button.primary:hover {
        filter: brightness(1.08);
      }
      .button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .icon-button {
        width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 5px;
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: var(--hover);
        border-color: var(--subtle);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--subtle);
        border-radius: 5px;
        font-size: 11px;
        padding: 2px 7px;
        white-space: nowrap;
        width: fit-content;
      }
      .badge.teal {
        background: color-mix(in srgb, var(--teal) 8%, transparent);
        border-color: color-mix(in srgb, var(--teal) 24%, transparent);
      }
      .badge.blue {
        background: var(--accent-bg);
        border-color: color-mix(in srgb, var(--blue) 22%, transparent);
      }
      .badge.violet {
        background: color-mix(in srgb, var(--violet) 8%, transparent);
        border-color: color-mix(in srgb, var(--violet) 25%, transparent);
      }
      .label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 7px;
      }
      .providers {
        padding: 3px;
        display: flex;
        gap: 3px;
        border: 1px solid var(--subtle);
        border-radius: 7px;
        background: var(--side);
      }
      .providers button {
        padding: 6px 12px;
        border-radius: 4px;
        display: flex;
        gap: 7px;
        align-items: center;
        color: var(--muted);
      }
      .providers .active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 4px rgb(0 0 0 / 10%);
      }
      .scope {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 23px;
      }
      .scope .host {
        font-size: 12px;
        color: var(--faint);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--subtle);
        gap: 23px;
      }
      .tabs button {
        padding: 10px 0 12px;
        color: var(--muted);
        position: relative;
        font-size: 13px;
        white-space: nowrap;
      }
      .tabs .active {
        color: var(--text);
      }
      .tabs .active:after {
        position: absolute;
        content: "";
        height: 2px;
        background: var(--accent);
        bottom: -1px;
        left: 0;
        right: 0;
      }
      .tabs .count {
        margin-left: 6px;
        font-size: 10px;
        color: var(--faint);
      }
      .filterbar {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 13px 0;
        flex-wrap: wrap;
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .chip {
        padding: 5px 10px;
        border-radius: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .chip:hover {
        background: var(--hover);
      }
      .chip.active {
        background: var(--active);
        color: var(--text);
      }
      .search {
        display: flex;
        gap: 7px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--subtle);
        border-radius: 6px;
        padding: 6px 9px;
        min-width: 170px;
        max-width: 260px;
        margin-left: auto;
        color: var(--faint);
      }
      .search input {
        border: 0;
        outline: none;
        background: none;
        color: var(--text);
        width: 100%;
        font-size: 12px;
        min-width: 0;
      }
      .key {
        font-size: 10px;
        padding: 0 4px;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .table {
        width: 100%;
        border: 1px solid var(--subtle);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .table-scroll {
        overflow: auto;
      }
      .table-header,
      .task-row {
        display: grid;
        grid-template-columns: 66px minmax(260px, 1fr) 100px 105px 120px 66px;
        align-items: center;
        gap: 14px;
        min-width: 820px;
        padding: 0 18px;
      }
      .table-header {
        height: 37px;
        color: var(--faint);
        font-size: 11px;
        background: var(--side);
        border-bottom: 1px solid var(--subtle);
      }
      .task-row {
        width: 100%;
        min-height: 68px;
        text-align: left;
        border-bottom: 1px solid var(--subtle);
        color: var(--secondary);
      }
      .task-row:last-child {
        border-bottom: 0;
      }
      .task-row:hover {
        background: var(--hover);
      }
      .task-row.selected {
        background: var(--accent-bg);
        box-shadow: inset 2px 0 var(--accent);
      }
      .task-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        line-height: 1.7;
      }
      .task-context {
        font-size: 11px;
        color: var(--faint);
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 3px;
      }
      .mini-label {
        border: 1px solid var(--subtle);
        border-radius: 3px;
        padding: 0 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .avatar {
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        background: var(--active);
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 10px;
      }
      .table-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 16px;
        color: var(--faint);
        font-size: 11px;
        border-top: 1px solid var(--subtle);
      }
      .insight {
        display: flex;
        gap: 20px;
        margin: 16px 0;
        color: var(--faint);
        font-size: 11px;
      }
      .insight span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .alert {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 13px;
        margin: 12px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .alert .icon {
        color: var(--violet);
      }
      .empty {
        text-align: center;
        padding: 75px 20px;
        background: var(--surface);
        border: 1px solid var(--subtle);
        border-radius: 8px;
      }
      .empty .icon {
        width: 29px;
        height: 29px;
        color: var(--faint);
        margin-bottom: 14px;
      }
      .empty h2 {
        font-size: 15px;
      }
      .empty p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 18px;
      }
      .split-layout {
        display: grid;
        grid-template-columns: minmax(260px, 0.85fr) minmax(350px, 1.15fr);
        border: 1px solid var(--subtle);
        border-radius: 8px;
        overflow: hidden;
        min-height: 520px;
      }
      .compact-list {
        background: var(--surface);
        border-right: 1px solid var(--subtle);
      }
      .compact-row {
        display: block;
        text-align: left;
        padding: 16px;
        width: 100%;
        border-bottom: 1px solid var(--subtle);
      }
      .compact-row.selected {
        background: var(--accent-bg);
        box-shadow: inset 2px 0 var(--accent);
      }
      .compact-row:hover {
        background: var(--hover);
      }
      .compact-row .task-title {
        margin: 7px 0;
      }
      .inspector {
        background: var(--bg);
        padding: 22px;
        min-width: 0;
      }
      .inspector h2 {
        font-size: 18px;
        line-height: 1.6;
      }
      .inspector .details-body {
        padding: 20px 0;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(230px, 1fr));
        gap: 15px;
        overflow: auto;
        padding-bottom: 10px;
      }
      .lane {
        background: var(--side);
        border: 1px solid var(--subtle);
        border-radius: 8px;
        min-height: 440px;
        padding: 12px;
      }
      .lane-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        margin: 3px 2px 15px;
      }
      .board-card {
        display: block;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--subtle);
        border-radius: 6px;
        text-align: left;
        padding: 14px;
        margin-bottom: 10px;
      }
      .board-card:hover {
        border-color: var(--accent);
      }
      .board-card .task-title {
        margin: 9px 0 14px;
      }
      .board-card .row {
        font-size: 11px;
      }
      .board-note {
        font-size: 11px;
        color: var(--faint);
        margin: 0 0 13px;
      }
      .detail-top {
        margin-bottom: 22px;
      }
      .detail-title {
        font-size: 23px;
        line-height: 1.5;
        max-width: 800px;
        margin: 16px 0;
      }
      .detail-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 36px;
      }
      .details-body {
        padding: 26px 0;
        max-width: 760px;
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.9;
      }
      .details-body h3 {
        margin: 20px 0 10px;
        color: var(--text);
        font-size: 14px;
      }
      .details-body h3:first-child {
        margin-top: 0;
      }
      .check-item {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin: 7px 0;
      }
      .check-item .box {
        border: 1px solid var(--line);
        width: 13px;
        height: 13px;
        border-radius: 3px;
        margin-top: 6px;
        flex-shrink: 0;
      }
      .properties {
        border-left: 1px solid var(--subtle);
        padding-left: 24px;
        padding-top: 24px;
      }
      .property {
        margin-bottom: 22px;
      }
      .property .label {
        font-size: 11px;
        color: var(--faint);
      }
      .activity {
        border-top: 1px solid var(--subtle);
        padding: 23px 0;
      }
      .activity-item {
        display: flex;
        gap: 12px;
        padding: 15px 0;
      }
      .activity-item p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .run-link {
        border: 1px solid var(--subtle);
        border-radius: 7px;
        background: var(--surface);
        padding: 17px;
        text-align: left;
        display: block;
        width: 100%;
        margin: 18px 0;
      }
      .run-link:hover {
        border-color: var(--accent);
      }
      .session-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid var(--subtle);
        background: var(--surface);
        border-radius: 7px;
        padding: 14px 17px;
        margin-bottom: 24px;
        gap: 15px;
      }
      .session-icon {
        height: 34px;
        width: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--violet);
      }
      .section-title {
        margin: 24px 0 13px;
      }
      .run-row {
        display: grid;
        grid-template-columns: minmax(200px, 1fr) 120px 110px 130px 70px;
        gap: 15px;
        align-items: center;
        text-align: left;
        width: 100%;
        padding: 18px;
        border-bottom: 1px solid var(--subtle);
      }
      .run-row:last-child {
        border-bottom: 0;
      }
      .run-row:hover {
        background: var(--hover);
      }
      .execution-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 24px;
      }
      .terminal {
        border: 1px solid var(--subtle);
        background: var(--side);
        border-radius: 7px;
        overflow: hidden;
      }
      .terminal-head {
        height: 39px;
        padding: 0 15px;
        border-bottom: 1px solid var(--subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--faint);
      }
      .terminal pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        min-height: 290px;
        padding: 22px;
        margin: 0;
        font:
          12px/2 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        color: var(--muted);
      }
      .timeline {
        border: 1px solid var(--subtle);
        border-radius: 7px;
        padding: 18px;
        background: var(--surface);
      }
      .timeline-step {
        display: flex;
        gap: 11px;
        margin: 20px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .timeline-step .dot {
        margin-top: 7px;
      }
      .connections {
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 18px;
      }
      .connection {
        padding: 24px;
        border: 1px solid var(--subtle);
        border-radius: 8px;
        background: var(--surface);
      }
      .connection dl {
        display: grid;
        grid-template-columns: 95px 1fr;
        gap: 14px;
        font-size: 12px;
        margin: 22px 0;
      }
      .connection dt {
        color: var(--faint);
      }
      .connection dd {
        margin: 0;
      }
      .connection .row h2 {
        margin: 0;
      }
      .flow-note {
        padding: 18px 0;
        border-bottom: 1px solid var(--subtle);

      }
      function connections() {
        return `<div class="page-head"><div><h1>代码平台连接</h1><p class="muted small">使用平台 CLI 的现有登录；当前为合成连接。</p></div></div><div class="connections">${["github", "gitlab"].map((p) => `<section class="connection"><h2 class="row">${icon(p)}${p === "github" ? "GitHub" : "GitLab"}</h2><p class="small faint">${p === "github" ? "github.com" : "gitlab.example.invalid"}</p><span class="badge teal">已连接 · 示例身份</span><p style="margin-top:20px">绑定项目：Console、SDK、Docs</p><button class="button" data-provider="${p}">查看任务${icon("arrow")}</button></section>`).join("")}</div>`;
      }
      function render() {
        closeMenu();
        const terminal = S.view === "terminal";
        document.querySelector("#app").innerHTML =
          `<div class="app ${terminal && S.focused ? "terminal-focus" : ""}">${sidebar()}<main class="main ${terminal ? "terminal-mode" : ""}"><header class="topbar"><span>工作台 / ${terminal ? "终端" : S.view === "connections" ? "代码平台连接" : "任务"}</span><span class="row"><button class="prototype-note" data-menu="demo" title="仅用于演示 Herdr 安装和更新状态">交互原型 · 演示状态</button><span class="tiny faint">PRD v0.3</span></span></header><div class="content">${terminal ? terminalPage() : S.view === "connections" ? connections() : tasksPage()}</div></main></div>${S.preview && S.view === "tasks" ? `<aside class="quick-preview" role="dialog" aria-modal="false" aria-label="任务快速预览">${detail(S.preview, true)}</aside>` : ""}`;
        const q = new URLSearchParams({ view: S.view, provider: S.provider });
        history.replaceState({}, "", location.pathname + "?" + q);
      }
      function openContext(t) {
        S.context = { ...t, text: contextText(t) };
        showContext();
      }
      function showContext() {
        document.querySelector("#overlay").innerHTML =
          `<div class="scrim"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="context-title"><div class="modal-head row between"><h2 id="context-title">任务上下文</h2><button class="icon-button" data-action="close-context" aria-label="关闭任务上下文">${icon("close")}</button></div><div class="modal-body"><p class="small muted">准备好任务内容，在终端中使用你选择的工具继续处理。</p><div class="field"><label class="label" for="context-text">可复制的任务内容</label><textarea id="context-text">${esc(S.context.text)}</textarea></div><p class="tiny faint">不自动投递提示词，不创建执行记录。</p></div><div class="modal-footer"><span class="small faint">项目：${S.context.project}</span><div class="row">${button(icon("copy") + "复制上下文", "copy-context")}${button("打开项目终端", "open-project-terminal", "primary")}</div></div></section></div>`;
        document.querySelector("#context-text").focus();
      }
      function closeContext() {
        document.querySelector("#overlay").innerHTML = "";
      }
      document.addEventListener("click", async (e) => {
        const pane = e.target.closest("[data-pane]");
        if (pane) {
          current().active = pane.dataset.pane;
          document
            .querySelectorAll(".terminal-pane")
            .forEach((el) => el.classList.toggle("pane-active", el === pane));
        }
        const b = e.target.closest("button");
        if (!b) {
          const row = e.target.closest("[data-row-task]");
          if (row) {
            row.querySelector("[data-task]").click();
            return;
          }
          if (!e.target.closest(".popover")) closeMenu();
          return;
        }
        if (b.disabled) return;
        if (b.dataset.menu) {
          openMenu(b, b.dataset.menu);
          return;
        }
        if (b.dataset.choice) {
          const type = b.dataset.choice,
            v = b.dataset.value;
          closeMenu();
          if (type === "projects") {
            S.project = v;
            S.detail = null;
            S.preview = null;
            render();
          } else if (type === "split") {
            const t = current();
            t.layout = v;
            if (t.panes.length === 1) {
              const id = "pane-" + ++sequence;
              t.panes.push({ id, app: "shell", history: [], draft: "" });
              t.active = id;
            }
            render();
          } else {
            S.tool = {
              status:
                v === "missing" ? "missing" : v === "error" ? "error" : "ready",
              update: v === "outdated",
              updating: false,
            };
            refreshTool();
            toast("模拟状态已切换，不影响终端。");
          }
          return;
        }
        if (b.dataset.nav) {
          S.view = b.dataset.nav;
          S.detail = null;
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.project) {
          S.project = b.dataset.project;
          S.view = "tasks";
          S.detail = null;
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.provider) {
          S.provider = b.dataset.provider;
          S.kind = "issues";
          S.view = "tasks";
          S.detail = null;
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.kind) {
          S.kind = b.dataset.kind;
          S.detail = null;
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.filter) {
          S.filter = b.dataset.filter;
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.task) {
          S.detail = tasks().find((t) => t.number === b.dataset.task);
          S.preview = null;
          render();
          return;
        }
        if (b.dataset.preview) {
          S.preview = tasks().find((t) => t.number === b.dataset.preview);
          render();
          return;
        }
        if (b.dataset.terminalTab) {
          S.activeTab = b.dataset.terminalTab;
          render();
          return;
        }
        if (b.dataset.closePane) {
          const t = current();
          t.panes = t.panes.filter((p) => p.id !== b.dataset.closePane);
          if (!t.panes.some((p) => p.id === t.active)) t.active = t.panes[0].id;
          render();
          return;
        }
        const a = b.dataset.action;
        if (a === "theme") {
          document.documentElement.dataset.theme =
            document.documentElement.dataset.theme === "dark"
              ? "light"
              : "dark";
          return;
        }
        if (a === "back-list") {
          S.detail = null;
          S.preview = null;
          render();
          return;
        }
        if (a === "full-detail") {
          S.detail = S.preview;
          S.preview = null;
          render();
          return;
        }
        if (a === "close-preview") {
          const id = S.preview?.number;
          S.preview = null;
          render();
          document.querySelector(`[data-preview="${id}"]`)?.focus();
          return;
        }
        if (a === "task-terminal") {
          openContext(S.preview || S.detail);
          return;
        }
        if (a === "context") {
          showContext();
          return;
        }
        if (a === "close-context") {
          closeContext();
          return;
        }
        if (a === "copy-context") {
          S.context.text = document.querySelector("#context-text").value;
          try {
            await navigator.clipboard.writeText(S.context.text);
            toast("任务上下文已复制。");
          } catch {
            toast("请选中文本并复制。");
          }
          return;
        }
        if (a === "open-project-terminal") {
          S.context.text = document.querySelector("#context-text").value;
          const existing = S.sessions.find(
            (x) => x.project === S.context.project,
          );
          if (existing) S.activeTab = existing.id;
          else newTerminal(S.context.project);
          closeContext();
          S.view = "terminal";
          render();
          return;
        }
        if (a === "new-terminal") {
          newTerminal(current().project);
          render();
          return;
        }
        if (a === "herdr") {
          launchHerdr();
          return;
        }
        if (a === "shell") {
          activePane().app = "shell";
          render();
          return;
        }
        if (a === "focus") {
          S.focused = !S.focused;
          render();
          document.querySelector('[data-action="focus"]')?.focus();
          return;
        }
        if (a === "update-herdr") {
          if (S.tool.updating) return;
          S.tool.updating = true;
          refreshTool();
          setTimeout(() => {
            S.tool.updating = false;
            S.tool.update = false;
            refreshTool();
            toast("模拟后台更新完成；当前会话继续运行。");
          }, 800);
          return;
        }
        if (a === "more") {
          S.loaded = true;
          render();
          return;
        }
        if (a === "clear") {
          S.search = "";
          S.filter = "open";
          S.project = "所有项目";
          render();
          return;
        }
        if (a === "refresh") {
          toast("示例任务已刷新。");
          return;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "search") {
          const position = e.target.selectionStart;
          S.search = e.target.value;
          S.preview = null;
          render();
          const input = document.querySelector("#search");
          input.focus();
          input.setSelectionRange(position, position);
        }
        if (e.target.dataset?.shellCommand) {
          const p = current().panes.find(
            (p) => p.id === e.target.dataset.shellCommand,
          );
          if (p) p.draft = e.target.value;
        }
      });
      document.addEventListener("focusin", (e) => {
        const pane = e.target.closest("[data-pane]");
        if (pane) {
          current().active = pane.dataset.pane;
          document
            .querySelectorAll(".terminal-pane")
            .forEach((el) => el.classList.toggle("pane-active", el === pane));
        }
      });
      document.addEventListener("submit", (e) => {
        const id = e.target.dataset?.shellForm;
        if (!id) return;
        e.preventDefault();
        current().active = id;
        const p = activePane(),
          command = p.draft.trim();
        if (!command) return;
        p.draft = "";
        p.history.push("❯ " + command);
        if (command === "herdr") {
          launchHerdr();
          return;
        }
        if (command === "pwd")
          p.history.push("~/projects/" + current().project.toLowerCase());
        else if (command === "ls")
          p.history.push("src/    docs/    Cargo.toml    README.md");
        else if (command === "clear") p.history = [];
        else p.history.push("原型未执行此命令。");
        render();
        document.querySelector(`[data-shell-command="${id}"]`)?.focus();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (menu) {
            closeMenu();
            menuTrigger?.focus();
            return;
          }
          if (document.querySelector(".modal")) {
            closeContext();
            return;
          }
          if (S.preview) {
            S.preview = null;
            render();
            return;
          }
        }
        if (menu && ["ArrowDown", "ArrowUp"].includes(e.key)) {
          e.preventDefault();
          const options = [...menu.querySelectorAll("button")],
            i = options.indexOf(document.activeElement);
          options[
            (i + (e.key === "ArrowDown" ? 1 : -1) + options.length) %
              options.length
          ].focus();
          return;
        }
        if (e.code === "Space" && e.target.matches(".task-open")) {
          e.preventDefault();
          S.preview = tasks().find((t) => t.number === e.target.dataset.task);
          render();
          return;
        }
        const modal = document.querySelector(".modal");
        if (modal && e.key === "Tab") {
          const items = [...modal.querySelectorAll("button,textarea")],
            first = items[0],
            last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
          return;
        }
        if (
          e.key === "/" &&
          !e.target.closest("input,textarea,.terminal-host")
        ) {
          e.preventDefault();
          document.querySelector("#search")?.focus();
        }
      });
      window.addEventListener("resize", closeMenu);
      window.addEventListener("scroll", closeMenu, true);
      render();
    </script>
  </body>
</html>
