<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Native · 独立交互原型</title>
    <style>
      /* Standalone prototype; theme values follow AgentHub's Catppuccin workbench. */
      :root {
        color-scheme: light;
        --bg: #eff1f5;
        --side: #e6e9ef;
        --surface: #fff;
        --hover: #eceef3;
        --active: #dce1ec;
        --line: #d5d9e3;
        --text: #4c4f69;
        --sub: #5c5f77;
        --muted: #6c6f85;
        --accent: #1e66f5;
        --on: #fff;
        --tint: rgba(30, 102, 245, 0.09);
        --green: #287841;
        --red: #d20f39;
        --yellow: #97680e;
        --purple: #7940bf;
      }
      .dark {
        color-scheme: dark;
        --bg: #1e1e2e;
        --side: #1b1b29;
        --surface: #232332;
        --hover: #2a2a3c;
        --active: #35354b;
        --line: #323245;
        --text: #cdd6f4;
        --sub: #bac2de;
        --muted: #9399b2;
        --accent: #89b4fa;
        --on: #11111b;
        --tint: rgba(137, 180, 250, 0.1);
        --green: #a6e3a1;
        --red: #f38ba8;
        --yellow: #f9e2af;
        --purple: #cba6f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 11px;
        display: inline-flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hover);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
        font-weight: 600;
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
      }
      button.small {
        padding: 4px 8px;
        font-size: 12px;
      }
      .selected {
        background: var(--tint) !important;
        color: var(--accent) !important;
        border-color: var(--accent) !important;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      input,
      textarea {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        padding: 9px 10px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 90px;
      }
      label {
        display: block;
        margin: 15px 0 6px;
        font-size: 12px;
        color: var(--sub);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      p {
        color: var(--sub);
      }
      small,
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .agent-trigger {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--sub);
      }
      .agent-menu {
        position: fixed;
        z-index: 100;
        padding: 5px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 24px #0003;
      }
      .agent-menu[hidden] {
        display: none;
      }
      .agent-menu button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        border: 0;
        text-align: left;
      }
      .agent-menu button[aria-selected="true"] {
        color: var(--accent);
        background: var(--tint);
      }
      .agent-menu button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        background: var(--hover);
      }
      .tag {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border: 1px solid var(--line);
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 11px;
        color: var(--muted);
      }
      .blue {
        color: var(--accent);
      }
      .green {
        color: var(--green);
      }
      .red {
        color: var(--red);
      }
      .yellow {
        color: var(--yellow);
      }
      .purple {
        color: var(--purple);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .titlebar {
        height: 42px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--side);
        gap: 20px;
        user-select: none;
      }
      .lights {
        display: flex;
        gap: 7px;
      }
      .lights i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--active);
      }
      .titlebar > span {
        font-size: 11px;
        color: var(--muted);
      }
      .address {
        margin: auto;
        min-width: 250px;
        padding: 3px 15px;
        font-size: 11px;
        color: var(--muted);
        background: var(--bg);
        border-radius: 5px;
      }
      .shell {
        display: flex;
        height: calc(100vh - 66px);
        min-height: 600px;
      }
      .rail {
        width: 51px;
        flex-shrink: 0;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 11px 5px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rail button {
        height: 38px;
        width: 40px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 5px;
      }
      .rail button.on {
        background: var(--tint);
        color: var(--accent);
        position: relative;
      }
      .rail button.on:before {
        content: "";
        position: absolute;
        left: -5px;
        width: 2px;
        height: 24px;
        background: var(--accent);
      }
      .rail svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rail .bottom {
        margin-top: auto;
      }
      .sidebar {
        width: 252px;
        flex-shrink: 0;
        background: var(--side);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .side-title {
        padding: 19px 17px 14px;
      }
      .side-title strong {
        font-size: 14px;
      }
      .side-title small {
        display: block;
        margin-top: 4px;
      }
      .side-label {
        color: var(--muted);
        font-size: 11px;
        padding: 20px 17px 8px;
      }
      .navitem {
        border: 0;
        background: transparent;
        text-align: left;
        justify-content: flex-start;
        width: calc(100% - 16px);
        margin: 2px 8px;
        padding: 9px 10px;
      }
      .navitem.active {
        background: var(--tint);
        color: var(--accent);
      }
      .navitem .tag {
        margin-left: auto;
      }
      .side-bottom {
        padding: 16px;
        margin-top: auto;
        border-top: 1px solid var(--line);
      }
      .side-bottom p {
        font-size: 11px;
        margin-top: 6px;
      }
      .workspace {
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .workspace .path {
        font-size: 11px;
        margin-top: 3px;
        color: var(--muted);
      }
      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
        position: relative;
      }
      .page {
        max-width: 1280px;
        margin: auto;
        padding: 29px 32px 110px;
      }
      .breadcrumb {
        display: flex;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 23px;
      }
      .headline {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 22px;
      }
      .headline p {
        margin-top: 5px;
        font-size: 12px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .panel-head {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
      }
      .panel-body {
        padding: 18px;
      }
      .flags {
        max-width: 920px;
      }
      .protocol {
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.1px;
      }
      .flag-banner {
        padding: 17px 20px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--yellow);
        border-radius: 6px;
        margin: 25px 0;
        color: var(--sub);
        font-size: 12px;
        background: var(--surface);
      }
      .flag {
        padding: 25px 24px;
        display: flex;
        gap: 22px;
        align-items: flex-start;
      }
      .flag-icon {
        width: 48px;
        height: 48px;
        border-radius: 11px;
        background: var(--tint);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 650;
      }
      .flag h2 {
        font-size: 17px;
      }
      .flag p {
        font-size: 12px;
        margin: 8px 0;
        max-width: 540px;
      }
      .toggle {
        width: 36px;
        height: 21px;
        padding: 2px;
        border: 0;
        border-radius: 20px;
        background: var(--active);
        justify-content: flex-start;
        margin-top: 2px;
      }
      .toggle span {
        height: 17px;
        width: 17px;
        border-radius: 50%;
        background: var(--sub);
      }
      .toggle.enabled {
        background: var(--accent);
        justify-content: flex-end;
      }
      .toggle.enabled span {
        background: var(--on);
      }
      .flag-note {
        padding: 15px 24px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 65px 20px;
        text-align: center;
      }
      .empty p {
        margin: 12px 0 22px;
      }
      .hint {
        padding: 10px 13px;
        background: var(--tint);
        border-radius: 6px;
        color: var(--sub);
        font-size: 12px;
      }
      .human-strip {
        display: grid;
        grid-template-columns: 1fr 1.65fr 1fr;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 23px;
        overflow: hidden;
      }
      .human-strip > div {
        padding: 13px 16px;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }
      .human-strip > div:last-child {
        border: 0;
      }
      .human-strip b {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .human-strip small {
        font-size: 11px;
      }
      .human-strip .auto {
        background: var(--tint);
      }
      .tabs {
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 23px;
        margin-bottom: 23px;
      }
      .tabs button {
        padding: 9px 0 11px;
        background: transparent;
        border: 0;
        border-radius: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .tabs button.active {
        border-bottom: 2px solid var(--accent);
        color: var(--text);
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 292px;
        gap: 18px;
        align-items: start;
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .step {
        position: relative;
        display: flex;
        align-items: flex-start;
        text-align: left;
        justify-content: flex-start;
        width: 100%;
        padding: 13px 15px;
        background: var(--surface);
        border-radius: 7px;
        border: 1px solid var(--line);
        gap: 12px;
        margin-bottom: 20px;
        white-space: normal;
      }
      .step:not(:last-child):after {
        content: "↓";
        position: absolute;
        left: 29px;
        bottom: -21px;
        color: var(--muted);
        font-size: 12px;
      }
      .step.active {
        border-color: var(--accent);
        background: var(--tint);
      }
      .step .step-mark {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }
      .step .step-copy {
        flex: 1;
        min-width: 0;
      }
      .step h3 {
        font-size: 12px;
        margin-bottom: 4px;
      }
      .step p {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .step .tag {
        margin-top: 4px;
      }
      .stage-meta {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .section-title {
        margin-bottom: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-title h2 {
        font-size: 13px;
      }
      .inspector {
        position: sticky;
        top: 20px;
      }
      .inspector .panel-body {
        padding: 16px;
      }
      .inspector h3 {
        font-size: 13px;
      }
      .inspector input {
        font-size: 12px;
      }
      .segmented {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .segmented button {
        font-size: 11px;
        padding: 5px 8px;
      }
      .label-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 16px;
        margin-bottom: 6px;
      }
      .label-row label {
        margin: 0;
      }
      .label-row small {
        margin-left: auto;
      }
      .token {
        font:
          11px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .footnote {
        font-size: 11px;
        color: var(--muted);
        margin-top: 12px;
      }
      .case {
        display: grid;
        grid-template-columns: 25px minmax(0, 1fr) 75px;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }
      .case:last-child {
        border: 0;
      }
      .case input {
        width: 15px;
        accent-color: var(--accent);
        margin-top: 3px;
      }
      .case p {
        font-size: 12px;
        margin-top: 5px;
      }
      .case b {
        font-size: 12px;
        font-weight: 550;
      }
      .case .tag {
        justify-self: end;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar input {
        max-width: 330px;
      }
      .terminal {
        background: var(--side);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 19px;
        min-height: 330px;
        white-space: pre-wrap;
        font:
          12px/1.95 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .runline {
        display: grid;
        grid-template-columns: 65px 1fr;
        gap: 12px;
        margin-bottom: 8px;
      }
      .runline time {
        color: var(--muted);
        font-size: 10px;
      }
      .runline span {
        font-size: 12px;
      }
      .accept-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .accept-item {
        border-bottom: 1px solid var(--line);
        padding: 13px 0;
      }
      .accept-item:last-child {
        border: 0;
      }
      .accept-item p {
        font-size: 11px;
        margin-top: 4px;
      }
      .statusbar {
        height: 24px;
        background: var(--side);
        border-top: 1px solid var(--line);
        padding: 0 12px;
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 10px;
        color: var(--muted);
      }
      .statusbar .right {
        margin-left: auto;
      }
      .switcher {
        position: fixed;
        bottom: 39px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border: 1px solid var(--line);
        background: var(--side);
        border-radius: 9px;
        box-shadow: 0 8px 30px #0003;
        z-index: 20;
      }
      .switcher span {
        font-size: 11px;
        padding: 0 9px;
      }
      .switcher button {
        font-size: 11px;
        padding: 5px 8px;
      }
      .switcher .sep {
        width: 1px;
        height: 19px;
        background: var(--line);
        padding: 0;
        margin: 0 4px;
      }
      .toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--accent);
        padding: 12px 20px;
        border-radius: 7px;
        box-shadow: 0 8px 24px #0002;
        z-index: 80;
        max-width: 80vw;
        font-size: 12px;
      }
      .matrix-row {
        display: grid;
        grid-template-columns: 65px 1fr 70px;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .matrix-row:last-child {
        border: 0;
      }
      .matrix-row span:first-child {
        color: var(--muted);
      }
      .matrix-row .tag {
        justify-self: end;
      }
      .subheading {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 13px;
      }
      .empty-state {
        padding: 25px;
        text-align: center;
        color: var(--muted);
      }
      dialog {
        padding: 0;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        width: min(860px, calc(100vw - 40px));
        max-height: 85vh;
        box-shadow: 0 25px 100px #0005;
      }
      dialog::backdrop {
        background: #1116;
        backdrop-filter: blur(4px);
      }
      .modal-head {
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-body {
        padding: 21px 22px;
        overflow: auto;
        max-height: calc(85vh - 145px);
      }
      .modal-foot {
        padding: 14px 22px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: 9px;
      }
      .modal-body pre {
        white-space: pre-wrap;
        background: var(--bg);
        padding: 16px;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.75;
      }
      .code-editor {
        font:
          12px/1.7 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        min-height: 330px;
      }
      .error {
        font-size: 12px;
        color: var(--red);
        margin-top: 9px;
      }
      .palette {
        width: min(700px, calc(100vw - 40px));
        margin-top: 15vh;
      }
      .palette input {
        border: 0;
        border-radius: 0;
        padding: 20px 24px;
        font-size: 17px;
        background: var(--surface);
      }
      .palette-result {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 24px;
        text-align: left;
        justify-content: flex-start;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: var(--tint);
      }
      .palette-result b {
        display: block;
        font-size: 13px;
      }
      .palette footer {
        padding: 11px 22px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      .compact-layout .split {
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      }
      .compact-layout .steps {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .compact-layout .step {
        margin: 0;
        min-height: 100px;
      }
      .compact-layout .step:after {
        display: none;
      }
      .compact-layout .step-mark {
        display: none;
      }
      .plan-note {
        padding: 15px;
        border-radius: 7px;
        background: var(--bg);
        font-size: 12px;
        color: var(--sub);
        margin-top: 14px;
      }
      .risk {

                  `<div class="matrix-row"><span>${esc(x.id)}</span><span>${esc(x.title)}</span><span class="tag">待验</span></div>`,
              )
              .join("")
          : '<div class="empty-state">没有匹配子项</div>';
      }
      function filterBaseline(query) {
        $("baseline-rows").innerHTML = baselineRows(query);
      }
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          if ($("palette").open) $("palette").close();
          else if (!$("modal").open) openPalette();
          return;
        }
        if (
          $("modal").open ||
          $("palette").open ||
          e.target.closest("input,textarea,[contenteditable]")
        )
          return;
      });
      $("modal").addEventListener("click", (e) => {
        if (e.target === $("modal")) {
          const r = $("modal").getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeModal();
        }
      });
      if (new URLSearchParams(location.search).get("theme") === "light") {
        document.documentElement.classList.remove("dark");
        $("theme-btn").textContent = "深色";
      }
      tab = defaultTab();
      render();
      window.addEventListener("beforeunload", () => {
        for (const timer of taskTimers.values()) clearTimeout(timer);
      });
    </script>
  </body>
</html>
